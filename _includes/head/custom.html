{% include base_path %}

<!-- start custom head snippets -->

<!-- Site icon: blue "AD" on a transparent background, readable in light and dark UIs -->
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/logo.svg?v=ad1">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-96x96.png?v=ad1" sizes="96x96">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png?v=ad1" sizes="32x32">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-16x16.png?v=ad1" sizes="16x16">
<link rel="shortcut icon" href="{{ base_path }}/images/favicon.ico?v=ad1">
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v=ad1">
<link rel="manifest" href="{{ base_path }}/images/manifest.json?v=ad1">
<link rel="mask-icon" href="{{ base_path }}/images/safari-pinned-tab.svg?v=ad1" color="#2f7fe0">
<meta name="msapplication-TileColor" content="#ffffff">
<meta name="msapplication-TileImage" content="{{ base_path }}/images/mstile-144x144.png?v=ad1">
<meta name="msapplication-config" content="{{ base_path }}/images/browserconfig.xml?v=ad1">
<meta name="theme-color" content="#ffffff">

<!-- Light/dark theme: light by default; apply a saved "dark" choice before first paint -->
<script>
  (function () {
    try {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>


<!-- Support for MatJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- end custom head snippets -->
